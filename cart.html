<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart | Epic Pokémon Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1c1c1c;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
    }

    .cart-info {
      flex: 1;
    }

    .cart-info h3 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    .price {
      color: #4caf50;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty button {
      background: #333;
      color: #fff;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .remove {
      background: #c0392b;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .total {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .checkout {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: #28a745;
      border: none;
      color: #fff;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      opacity: 0.7;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <h1>Your Cart</h1>

  <div id="cartItems"></div>

  <div class="total" id="totalPrice">Total: ₹0</div>

  <button class="checkout" onclick="goCheckout()">Place Order</button>

  <script>
    const cartContainer = document.getElementById("cartItems");
    const totalPriceEl = document.getElementById("totalPrice");

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      cartContainer.innerHTML = "";

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="empty">Your cart is empty</p>';
        totalPriceEl.innerText = "Total: ₹0";
        return;
      }

      let total = 0;

      cart.forEach((item, index) => {
        total += Number(item.price) * item.qty;

        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="cart-info">
            <h3>${item.name}</h3>
            <div class="price">₹${item.price}</div>
            <div class="qty">
              <button onclick="changeQty(${index}, -1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
          </div>
          <button class="remove" onclick="removeItem(${index})">Remove</button>
        `;

        cartContainer.appendChild(div);
      });

      totalPriceEl.innerText = `Total: ₹${total}`;
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function changeQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function goCheckout() {
      if (cart.length === 0) {
        alert("Cart is empty");
        return;
      }
      window.location.href = "checkout.html";
    }

    renderCart();
  </script>

</body>
</html>
