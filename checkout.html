<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body {
    background:#0f0f0f;
    color:#fff;
    font-family:Arial, sans-serif;
    padding:20px;
}

h1{text-align:center}

.item{
    background:#1c1c1c;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}

.qty-btn{
    padding:4px 10px;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.minus{background:#ff4444}
.plus{background:#22c55e}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:20px;
}

.pay{
    width:100%;
    padding:14px;
    font-size:18px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    margin-top:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Checkout</h1>

<div id="items"></div>

<div class="total" id="total">Total: ₹0</div>

<button class="pay" onclick="placeOrder()">Place Order</button>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];
let discount = 0;

if(cart.length === 0){
    document.getElementById("items").innerHTML = "<p>Your cart is empty</p>";
}

function renderCart(){
    const box = document.getElementById("items");
    box.innerHTML = "";
    let total = 0;

    cart.forEach((item,index)=>{
        total += item.price * item.qty;

        box.innerHTML += `
        <div class="item">
            <b>${item.name}</b><br>
            ₹${item.price} × ${item.qty}<br>
            <button class="qty-btn minus" onclick="changeQty(${index},-1)">-</button>
            <button class="qty-btn plus" onclick="changeQty(${index},1)">+</button>
        </div>
        `;
    });

    total -= discount;
    if(total < 0) total = 0;

    document.getElementById("total").innerText = "Total: ₹" + total;
}

function changeQty(index, change){
    cart[index].qty += change;

    if(cart[index].qty <= 0){
        cart.splice(index,1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function placeOrder(){

    if(cart.length === 0){
        alert("Cart is empty");
        return;
    }

    let totalAmount = 0;
    cart.forEach(item=>{
        totalAmount += item.price * item.qty;
    });

    const order = {
        id: "ORD-" + Date.now(),
        items: cart,
        total: totalAmount,
        date: new Date().toLocaleString()
    };

    orders.push(order);
    localStorage.setItem("orders", JSON.stringify(orders));

    // UPI LINK
    const upiID = "6291582420@fam";   // your UPI
    const name = "Epic Pokemon Store";

    const upiLink = `upi://pay?pa=${upiID}&pn=${name}&am=${totalAmount}&cu=INR`;

    window.location.href = upiLink;

    // After 3 seconds open WhatsApp
    setTimeout(()=>{
        const msg = encodeURIComponent(
            "New Order\n\n" +
            cart.map(i => `${i.name} × ${i.qty}`).join("\n") +
            "\n\nTotal: ₹" + totalAmount
        );

        window.open(`https://wa.me/919836190283?text=${msg}`, "_blank");

        // NOW clear cart (IMPORTANT — moved here)
        localStorage.removeItem("cart");

    },3000);
}

renderCart();

</script>

</body>
</html>
