<!DOCTYPE html>
<html>
<head>
  <title>Upload Products to Firebase</title>
</head>
<body>
  <h2>Uploading products to Firebase...</h2>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔥 YOUR FIREBASE CONFIG (PASTE YOURS HERE)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "XXXX",
      appId: "XXXX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🔁 LOAD YOUR EXISTING PRODUCTS
    const script = document.createElement("script");
    script.src = "products.js";
    document.body.appendChild(script);

    script.onload = async () => {
      for (const p of products) {
        await addDoc(collection(db, "products"), {
          name: p.name,
          price: p.price,
          image: p.image,
          description: p.description
        });
        console.log("Uploaded:", p.name);
      }
      alert("✅ ALL PRODUCTS UPLOADED TO FIRESTORE");
    };
  </script>
</body>
</html>
